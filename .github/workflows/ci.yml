name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Проверка сборки
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  audit:
    name: Проверка зависимостей на уязвимости
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit (production dependencies)
        continue-on-error: true
        run: |
          mkdir -p audit-report
          npm audit --omit=dev --audit-level=high | tee audit-report/audit.txt
          npm audit --omit=dev --json > audit-report/audit.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: audit-report
          retention-days: 30

      - name: Уведомление о найденных уязвимостях
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          COUNT=$(node -e "try{const a=require('./audit-report/audit.json').metadata.vulnerabilities;console.log((a.high||0)+(a.critical||0))}catch(e){console.log(0)}")
          {
            echo "## Проверка зависимостей"
            echo ""
            if [ "$COUNT" -gt 0 ]; then
              echo "Найдено серьёзных уязвимостей: **$COUNT**. Отчёт приложен к запуску (dependency-audit-report)."
            else
              echo "Серьёзных уязвимостей не найдено."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ] && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TITLE="Уязвимости в зависимостях"
            EXISTING=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number')
            BODY="Проверка зависимостей нашла серьёзных уязвимостей: $COUNT.\n\nПодробный отчёт: $RUN_URL"
            if [ -n "$EXISTING" ]; then
              printf "%b" "$BODY" | gh issue comment "$EXISTING" --repo "$REPO" --body-file -
            else
              printf "%b" "$BODY" | gh issue create --repo "$REPO" --title "$TITLE" --body-file -
            fi
          fi

  deploy:
    name: Публикация на GitHub Pages
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Определить каталог публикации
        id: publish_dir
        run: |
          if [ -d ".output/public" ]; then
            echo "path=.output/public" >> "$GITHUB_OUTPUT"
          else
            echo "path=.output" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.publish_dir.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Проверка доступности сайта
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          STATUS=0
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$SITE_URL" || echo 0)
            [ "$STATUS" = "200" ] && break
            sleep 10
          done
          {
            echo "## Доступность сайта"
            echo ""
            echo "Адрес: $SITE_URL"
            if [ "$STATUS" = "200" ]; then
              echo ""
              echo "Сайт открывается, код ответа 200."
            else
              echo ""
              echo "Сайт не отвечает, код ответа $STATUS."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = "200" ]
